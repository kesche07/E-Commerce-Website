<html>
    <head>
        <title>Login</title>
        <style>
            .container{
                height:50%;
                width: 20%;
                margin:auto;
                padding:30px;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%); 
            }
            
            form input[type="text"] {
                height:10%;
                width:70%;
                margin:10;
                font-size:16px;
                font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                color: #54533B;;
                border-style:solid;
                border-width:1px;
                border-color: rgb(53, 53, 53);
                border-radius: 5%;
                box-shadow: 3px 3px 0px rgba(0, 0, 0 );
            }
            input[type="password"]{
                height:10%;
                width:70%;
                margin:10;
                font-size:16px;
                font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                color: #54533B;;
                border-style:solid;
                border-width:1px;
                border-color: rgb(53, 53, 53);
                border-radius: 5%;
                box-shadow: 3px 3px 0px rgba(0, 0, 0 );
            }
            .leaf{
                display: inline;
            }
        </style>
    </head>
    <body>
        <link rel="stylesheet" href="../CSS/style.css">
        <nav class="navbar">
             <div class="logo">
                <img src="../Assets/logo.png" alt="logo">
            </div>
                <ul class="nav-links">
                    <li><a href="../index.html">Home</a></li>|
                    <li><a href="./blog.html">Blog</a></li>|
                    <li><a href="./aboutus.html">About Us</a></li>|
                    <li><a href="./products.html">Products</a></li>|
                    <li><a href="./contact.html">Contact Page</a></li>|
                    <li><a href="./helpsupport.html">Help and Support</a></li>|
                    <li><a href="#">Login</a></li>
                </ul>
        </nav>

        <section class="container"> 
            <h3> Login</h3>  <img src="../Assets/leaf1.png " width="30px" class="leaf1">     
            <br><br>
            <form class="form">
                <label>Enter Username:</label> <input type="text" placeholder="Enter Username" id="user"><br><br>
                <label>Enter Password:</label><input type="password" placeholder="Enter Password" id="pass"><br><br>
                <button onclick="check()"> Login</button>
            </form>
        </section>
            
        <script>
            function check(){
                const u=document.getElementById("user").value;
                const p=document.getElementById("pass").value;

                if( u=="" && p==""){
                    alert("Please fill in the fields to proceed");
                    return false;
                }
                else{
                    window.location.href="aboutus.html";
                    return false;
                }
            }
        </script>
        
        <footer>
            <hr>
            <p>&copy website name 2026 </p>
        </footer>
    </body>
</html>
